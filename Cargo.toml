[workspace.package]
authors = ["Egor Berezovskiy"]
license = "MIT"
edition = "2024"
version = "0.1.0"
publish = false

# argon2 is ~10x slower unoptimized: keep logins and tests fast in debug builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1

[workspace]
resolver = "2"
members = ["bauth_client", "bauth_core", "bauth_server"]

[workspace.dependencies]
# Web server
axum = { version = "~0.8", features = ["macros", "multipart", "tracing"] }
tokio = { version = "~1.53", features = [
  "fs",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }
tower-http = { version = "~0.7", features = ["cors", "trace"] }
# API documentation
utoipa = { version = "~5.5", features = ["chrono", "uuid"] }
# Hot-swappable shared state (signing keys)
arc-swap = "~1.9"
# Background jobs
tokio-cron-scheduler = "~0.15"
# Rate limiting
governor = "~0.10"
# Configuration
dotenvy = "~0.15"
envconfig = "~0.11"
toml = "~1.1"
url = "~2.5"
# Database
sqlx = { version = "~0.9", default-features = false, features = [
  "uuid",
  "json",
  "chrono",
  "macros",
  "migrate",
  "postgres",
  "sqlx-toml",
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
] }
# Data types
uuid = { version = "~1.26", features = ["serde", "v4", "v7"] }
chrono = { version = "~0.4.45", features = ["serde"] }
# Serialisation
serde = { version = "~1.0", features = ["derive"] }
serde_json = "~1.0"
# Cryptography
aws-lc-rs = "~1.18"
argon2 = "~0.6"
getrandom = "~0.4"
sha2 = "~0.11"
base64 = "~0.23"
chacha20poly1305 = { version = "~0.11", default-features = false, features = ["alloc"] }
jsonwebtoken = { version = "~11.1", default-features = false, features = ["aws_lc_rs"] }
# Errors
thiserror = "~2.0"
# Observability
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", features = ["env-filter"] }
# Email
lettre = { version = "~0.11", default-features = false, features = [
  "aws-lc-rs",
  "builder",
  "hostname",
  "pool",
  "smtp-transport",
  "tokio1-rustls",
  "webpki-roots",
] }
# HTTP client
reqwest = { version = "~0.13", default-features = false, features = ["rustls", "json"] }
