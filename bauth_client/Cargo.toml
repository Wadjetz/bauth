[package]
name = "bauth_client"
authors.workspace = true
license.workspace = true
edition.workspace = true
version.workspace = true

[features]
# `AuthUser` extractor for axum APIs.
axum = ["dep:axum", "dep:serde_json"]
# `testing::FakeBauth`: a bauth issuer for the tests of an API (JWKS, `/me`, signed tokens).
test-support = [
  "axum",
  "dep:serde_json",
  "dep:aws-lc-rs",
  "dep:base64",
  "dep:getrandom",
]

[dependencies]
bauth_core = { path = "../bauth_core" }
axum = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
serde.workspace = true
jsonwebtoken.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
tokio.workspace = true
tower = { version = "~0.5", features = ["util"] }

[[test]]
name = "verifier"
# The tests use `testing::FakeBauth`; `cargo test --all-features` (what CI runs) enables it.
required-features = ["test-support"]
