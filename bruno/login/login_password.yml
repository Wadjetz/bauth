info:
  name: login_password
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/flows/login/:flow_id/password"
  params:
    - name: flow_id
      value: "{{flow_id}}"
      type: path
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.code) {
          bru.setEnvVar("login_code", res.body.code)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
