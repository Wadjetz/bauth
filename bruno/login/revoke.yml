info:
  name: revoke
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/oauth/revoke"
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: "{{client_id}}"
      - name: token
        value: ss
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
