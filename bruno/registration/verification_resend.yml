info:
  name: verification_resend
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/verification"
  body:
    type: json
    data: |-
      {
        "client_id": "{{client_id}}",
        "email": "{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
