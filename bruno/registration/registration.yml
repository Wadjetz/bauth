info:
  name: registration
  type: http
  seq: 5

http:
  method: POST
  url: "{{host}}/registration"
  body:
    type: json
    data: |-
      {
        "client_id": "{{client_id}}",
        "email": "{{email}}",
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
