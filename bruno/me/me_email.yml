info:
  name: /me/email
  type: http
  seq: 5

http:
  method: POST
  url: "{{host}}/me/email"
  body:
    type: json
    data: |-
      {
        "password": "{{password}}",
        "new_email": "new-{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
