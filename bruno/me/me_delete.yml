info:
  name: /me (delete)
  type: http
  seq: 7

http:
  method: DELETE
  url: "{{host}}/me"
  body:
    type: json
    data: |-
      {
        "password": "{{password}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
