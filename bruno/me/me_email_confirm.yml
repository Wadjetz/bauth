info:
  name: /me/email confirm
  type: http
  seq: 6

http:
  method: POST
  url: "{{host}}/verification/confirm"
  body:
    type: json
    data: |-
      {
        "token": "Token from email"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
