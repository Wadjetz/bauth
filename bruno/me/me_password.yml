info:
  name: /me/password
  type: http
  seq: 4

http:
  method: POST
  url: "{{host}}/me/password"
  body:
    type: json
    data: |-
      {
        "current_password": "{{password}}",
        "new_password": "{{password}}-new"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
