info:
  name: recovery
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/recovery"
  body:
    type: json
    data: |-
      {
        "client_id": "{{client_id}}",
        "email":"{{email}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
