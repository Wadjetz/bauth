name: _build_server()

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/wadjetz/bauth:cache
          cache-to: type=registry,ref=ghcr.io/wadjetz/bauth:cache,mode=max
          tags: |
            ghcr.io/wadjetz/bauth:latest
            ghcr.io/wadjetz/bauth:${{ github.sha }}
