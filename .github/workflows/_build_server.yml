name: _build_server()

on:
  workflow_call:
    inputs:
      version:
        description: Version of the image (workspace version, without `v`)
        required: true
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 0.3.0 → tags `0.3.0`, `0.3`, `latest` and the commit sha, plus OCI labels (version, revision…).
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/wadjetz/bauth
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build Docker image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          cache-from: type=registry,ref=ghcr.io/wadjetz/bauth:cache
          cache-to: type=registry,ref=ghcr.io/wadjetz/bauth:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
